[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel"
version = "0.1.0"
description = "Pixel — Cyber Florida AI Voice Assistant (engineering foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1",
  "pydantic>=2.10.0,<3",
  "pydantic-settings>=2.7.0,<3",
  "uvicorn[standard]>=0.34.0,<1",
  "psycopg[binary]>=3.2.0,<4",
  "httpx>=0.28.0,<1",
  "starlette>=0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0,<1",
  "pip-audit>=2.7.0",
  "pyright>=1.1.390",
  "pytest>=9.0.3,<10",
  "ruff>=0.9.0",
]

[project.scripts]
pixel-api = "pixel_api.main:run"
pixel-worker = "pixel_worker.main:main"

[tool.setuptools.packages.find]
where = ["apps/api", "apps/worker", "packages/pixel"]
include = ["pixel_api*", "pixel_worker*", "pixel*"]

[tool.setuptools.package-data]
pixel = ["knowledge/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/pixel/tests"]
pythonpath = ["apps/api", "apps/worker", "packages/pixel"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api", "apps/worker", "packages/pixel"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.pyright]
include = ["apps/api", "apps/worker", "packages/pixel"]
exclude = ["**/__pycache__", ".venv", "node_modules"]
extraPaths = ["apps/api", "apps/worker", "packages/pixel"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
