name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Format
        run: ruff format --check apps/api apps/worker packages/pixel
      - name: Lint
        run: ruff check apps/api apps/worker packages/pixel
      - name: Type check
        run: pyright
      - name: Tests
        run: pytest
      - name: Dependency scan
        run: pip-audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: npm ci
      - name: Format
        run: npm run web:format:check
      - name: Lint
        run: npm run web:lint
      - name: Type check
        run: npm run web:typecheck
      - name: Tests
        run: npm run web:test
      - name: Build
        run: npm run web:build
      - name: Install API for E2E
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: E2E
        run: npm run web:e2e
      - name: Dependency scan
        run: npm audit --audit-level=high
